  .item.done { opacity: 0.4; }

  .checkbox.checked { background: #10b981; border-color: #10b981; }
  .checkbox.checked::after { content: '✓'; color: #fff; font-size: 13px; font-weight: 700; }
  .item-body { flex: 1; min-width: 0; }
  .item-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sku { font-weight: 700; font-size: 14px; color: #fff; font-family: monospace; }
  .brand { font-size: 13px; color: #aaa; }
  .model { font-size: 12px; color: #666; margin-top: 2px; font-family: monospace; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
  .badge.placeholder { background: #2a1f00; color: #f59e0b; border: 1px solid #3d2e00; }
  .badge.failed { background: #1a0f0f; color: #f87171; border: 1px solid #3d1a1a; }
  .badge.manual { background: #0f1a2a; color: #60a5fa; border: 1px solid #1a3050; }
  .badge.done-badge { background: #0f2a1a; color: #34d399; border: 1px solid #1a4030; }
  .urls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

const STORAGE_KEY = "mh-image-checklist-v1";
let filter = "all";

function getState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch { return {}; }
}
function setState(sku, done) {
  const s = getState(); s[sku] = done;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
}

function isChecked(sku, defaultDone) {
  const s = getState();
  return sku in s ? s[sku] : !!defaultDone;
}

function toggle(sku) {
  const now = isChecked(sku);
  setState(sku, !now);
  render();
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('f-' + f)?.classList.add('active');
  render();
}

function resetAll() {
  if (!confirm("Reset ALL checkboxes to unchecked?")) return;
  localStorage.removeItem(STORAGE_KEY);
  render();
}

function urlLabel(url) {
  try {
    const host = new URL(url).hostname.replace('www.','').split('.')[0];
    return host.charAt(0).toUpperCase() + host.slice(1);
  } catch { return "Link"; }
}

function render() {
  const state = getState();
  const downloadable = ITEMS.filter(i => i.reason !== "manual");
  const manuals = ITEMS.filter(i => i.reason === "manual");
  const allItems = [...downloadable, ...manuals];

  let doneCount = 0, leftCount = 0, skipCount = 0;
  downloadable.forEach(i => { isChecked(i.sku, i.done) ? doneCount++ : leftCount++; });
  manuals.forEach(i => skipCount++);

  const total = downloadable.length;
  document.getElementById("statDone").textContent = doneCount;
  document.getElementById("statLeft").textContent = leftCount;
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSkip").textContent = skipCount;
  document.getElementById("progressFill").style.width = (total > 0 ? (doneCount / total * 100) : 0) + "%";

  const sections = [
    { title: "🔗 Placeholder — Download from link", items: ITEMS.filter(i => i.reason === "placeholder") },
    { title: "🔗 AI Failed — Download from link", items: ITEMS.filter(i => i.reason === "failed") },
    { title: "📷 Manual only — Physical photo needed", items: ITEMS.filter(i => i.reason === "manual") },
  ];

  let html = "";
  for (const sec of sections) {
    let filtered = sec.items;
    if (filter === "todo") filtered = filtered.filter(i => i.reason !== "manual" && !isChecked(i.sku, i.done));
    if (filter === "done") filtered = filtered.filter(i => isChecked(i.sku, i.done));
    if (filter === "placeholder") filtered = sec.reason === "placeholder" ? filtered : filtered.filter(i => i.reason === "placeholder");
    if (filter === "failed") filtered = filtered.filter(i => i.reason === "failed");
    if (filter === "manual") filtered = filtered.filter(i => i.reason === "manual");
    if (filtered.length === 0) continue;

    html += `<div class="section"><div class="section-title">${sec.title} (${filtered.length})</div>`;
    for (const item of filtered) {
      const checked = isChecked(item.sku, item.done);
      const isManual = item.reason === "manual";
      html += `<div class="item ${checked ? 'done' : ''}">
        <div class="checkbox ${checked ? 'checked' : ''}" onclick="toggle('${item.sku}')"></div>
        <div class="item-body">
          <div class="item-top">
            <span class="sku">${item.sku}</span>
            <span class="brand">${item.brand}</span>
            <span class="badge ${item.reason === 'placeholder' ? 'placeholder' : item.reason === 'failed' ? 'failed' : checked ? 'done-badge' : 'manual'}">${item.reason === 'placeholder' ? 'placeholder' : item.reason === 'failed' ? 'AI failed' : 'manual'}</span>
          </div>
          <div class="model">${item.model}</div>
          ${item.urls?.length ? `<div class="urls">${item.urls.map((u,i) => `<a href="${u}" target="_blank" class="url-link">🔗 Link ${i+1}: ${urlLabel(u)}</a>`).join('')}</div>` : ''}
          ${item.note ? `<div class="notes">💬 ${item.note}</div>` : ''}
        </div>
      </div>`;
    }
    html += "</div>";
  }

  if (!html) html = `<div class="empty">No items match the current filter.</div>`;
  document.getElementById("list").innerHTML = html;
}

render();
</script>
